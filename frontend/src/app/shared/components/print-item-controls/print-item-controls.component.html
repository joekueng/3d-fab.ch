<div
  (click)="$event.stopPropagation()"
  [class.card-controls--compact]="compact()"
  [class.card-controls--stacked]="stacked()"
  class="card-controls"
>
  <label class="qty-group">
    <span>{{ quantityLabelKey() | translate }}</span>
    <input
      type="number"
      min="1"
      step="1"
      class="qty-input"
      [ngModel]="quantity()"
      [ngModelOptions]="{
        standalone: true,
        updateOn: commitOnBlur() ? 'blur' : 'change',
      }"
      (ngModelChange)="quantityChange.emit($event)"
      [disabled]="disabled()"
    />
  </label>
  <div class="color-group">
    <span>{{ "CALC.COLOR_LABEL" | translate }}</span>
    <app-color-selector
      [selectedColor]="color()"
      [selectedVariantId]="variantId()"
      [variants]="variants()"
      [disabled]="disabled() || !variants().length"
      [compact]="compact()"
      [field]="stacked()"
      [showLabel]="showColorLabel()"
      (colorSelected)="colorChange.emit($event)"
    />
  </div>
</div>
