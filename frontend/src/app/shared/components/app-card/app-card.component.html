<div class="card">
  @if (title() || subtitle()) {
    <header class="card-header">
      @if (title()) {
        <h3 class="card-title">{{ title() }}</h3>
      }
      @if (subtitle()) {
        <p class="card-subtitle">{{ subtitle() }}</p>
      }
    </header>
  }
  <div
    class="card-body"
    [style.--app-card-body-padding]="bodyPadding() || null"
  >
    <ng-content></ng-content>
  </div>
</div>
