<div class="ui-form-group" [class.ui-form-group--flush]="compact()">
  @if (label()) {
    <label class="ui-form-label" [for]="id()">
      {{ label() }}
      @if (required()) {
        <span class="required-mark">*</span>
      }
    </label>
  }
  <input
    [id]="id()"
    [type]="type()"
    [attr.name]="name() || null"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete() || null"
    [attr.autocapitalize]="autocapitalize() || null"
    [attr.min]="min() ?? null"
    [attr.max]="max() ?? null"
    [attr.step]="step() ?? null"
    [attr.inputmode]="inputmode() || null"
    [attr.spellcheck]="spellcheck()"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onTouched()"
    [disabled]="isDisabled()"
    [readOnly]="readonly()"
    [required]="required()"
    class="ui-form-control"
  />
  @if (error()) {
    <span class="ui-form-error">{{ error() }}</span>
  }
</div>
