<div class="form-group">
  @if (label()) { <label [for]="id()">{{ label() }}</label> }
  <select
    [id]="id()"
    [value]="value"
    (change)="onSelect($event)"
    (blur)="onTouched()"
    [disabled]="disabled"
    class="form-control"
  >
    @for (opt of options(); track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>
  @if (error()) { <span class="error-text">{{ error() }}</span> }
</div>
