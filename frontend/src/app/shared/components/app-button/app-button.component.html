<button
  [type]="type()"
  [attr.aria-label]="ariaLabel()"
  [class]="buttonClass()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? true : null"
  (click)="handleClick($event)"
>
  <span *ngIf="loading()" class="button-spinner" aria-hidden="true"></span>
  <ng-content></ng-content>
</button>
