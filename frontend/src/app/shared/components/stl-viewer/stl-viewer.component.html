<div
  class="viewer-container"
  #rendererContainer
  [style.aspect-ratio]="aspectRatio"
  [style.height]="
    aspectRatio ? 'auto' : 'var(--stl-viewer-height, ' + height + 'px)'
  "
  [style.border-radius]="borderRadius"
>
  @if (loading) {
    <div class="loading-overlay">
      <div class="spinner"></div>
      <span>{{ "STL_VIEWER.LOADING" | translate }}</span>
    </div>
  }
  @if (loadError && !loading) {
    <div class="error-overlay">
      <span>{{ "STL_VIEWER.UNAVAILABLE" | translate }}</span>
    </div>
  }
  @if (showDimensions && file && !loading && !loadError) {
    <div class="dims-overlay">
      {{ dimensions.x }} x {{ dimensions.y }} x {{ dimensions.z }} mm
    </div>
  }
</div>
