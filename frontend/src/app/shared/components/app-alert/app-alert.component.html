<div
  class="alert ui-banner"
  [class.ui-banner--info]="type() === 'info'"
  [class.ui-banner--warning]="type() === 'warning'"
  [class.ui-banner--error]="type() === 'error'"
  [class.ui-banner--success]="type() === 'success'"
  [attr.role]="type() === 'error' ? 'alert' : 'status'"
>
  <ng-content></ng-content>
</div>
