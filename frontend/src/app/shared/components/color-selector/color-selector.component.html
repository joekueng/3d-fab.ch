<div class="color-selector-container" (keydown.escape)="close()">
  @if (isOpen() && !disabled()) {
    <div class="backdrop" (click)="close()"></div>
  }

  <button
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="getCurrentLabel() | translate"
    [attr.aria-expanded]="isOpen() && !disabled()"
    class="trigger"
    [class.trigger--label]="showLabel()"
    [title]="getCurrentLabel() | translate"
    (click)="toggleOpen()"
  >
    <span class="color-circle" [style.background-color]="getCurrentHex()"></span>
    @if (showLabel()) {
      <span class="trigger-copy"><strong>{{ getCurrentLabel() | translate }}</strong><small>{{ subtitle() }}</small></span>
    }
  </button>

  @if (isOpen() && !disabled()) {
    <div class="color-popup">
      @for (category of categories(); track category.name) {
        <div class="category">
          <div class="category-name">{{ category.name | translate }}</div>
          <div class="colors-grid">
            @for (color of category.colors; track color.value) {
              <button
                type="button"
                [disabled]="color.outOfStock"
                [attr.aria-pressed]="selectedVariantId() !== null ? selectedVariantId() === color.variantId : selectedColor() === color.value"
                class="color-item"
                (click)="selectColor(color)"
                [class.disabled]="color.outOfStock"
              >
                <div
                  class="selection-ring"
                  [class.active]="
                    selectedVariantId() !== null
                      ? selectedVariantId() === color.variantId
                      : selectedColor() === color.value
                  "
                  [class.out-of-stock]="color.outOfStock"
                >
                  <div
                    class="color-circle small"
                    [style.background-color]="color.hex"
                  ></div>
                </div>

                <span class="color-name">{{ color.label | translate }}</span>
              </button>
            }
          </div>
        </div>
      }
    </div>
  }
</div>
