<div
  (keydown.escape)="onEscape($event)"
  [class.color-selector-container--compact]="compact()"
  [class.color-selector-container--field]="field()"
  class="color-selector-container"
>
  <button
    cdkOverlayOrigin
    #colorTrigger="cdkOverlayOrigin"
    type="button"
    [disabled]="disabled()"
    [attr.aria-label]="getCurrentLabel() | translate"
    [attr.aria-expanded]="isOpen() && !disabled()"
    class="trigger"
    [class.trigger--label]="showLabel()"
    [title]="getCurrentLabel() | translate"
    (click)="toggleOpen()"
  >
    <span
      class="color-circle"
      [style.background-color]="getCurrentHex()"
    ></span>
    @if (showLabel()) {
      <span class="trigger-copy"
        ><strong>{{ getCurrentLabel() | translate }}</strong>
        @if (subtitle()) {
          <small>{{ subtitle() }}</small>
        }
      </span>
    }
    @if (field()) {
      <svg
        aria-hidden="true"
        class="trigger-chevron"
        fill="none"
        height="14"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
        width="14"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    }
  </button>

  <ng-template
    cdkConnectedOverlay
    [cdkConnectedOverlayOrigin]="colorTrigger"
    [cdkConnectedOverlayOpen]="isOpen() && !disabled()"
    [cdkConnectedOverlayUsePopover]="field() ? 'inline' : null"
    [cdkConnectedOverlayPositions]="popupPositions"
    [cdkConnectedOverlayPush]="true"
    [cdkConnectedOverlayViewportMargin]="12"
    [cdkConnectedOverlayScrollStrategy]="scrollStrategy"
    [cdkConnectedOverlayHasBackdrop]="true"
    cdkConnectedOverlayBackdropClass="color-selector-backdrop"
    (backdropClick)="close()"
    (detach)="close()"
  >
    <div class="color-popup">
      @for (category of categories(); track category.name) {
        <div class="category">
          <div class="category-name">{{ category.name | translate }}</div>
          <div class="colors-grid">
            @for (
              color of category.colors;
              track color.variantId ?? color.value
            ) {
              <button
                type="button"
                [disabled]="color.outOfStock"
                [attr.aria-pressed]="
                  selectedVariantId() !== null
                    ? selectedVariantId() === color.variantId
                    : selectedColor() === color.value
                "
                class="color-item"
                (click)="selectColor(color)"
                [class.disabled]="color.outOfStock"
              >
                <div
                  class="selection-ring"
                  [class.active]="
                    selectedVariantId() !== null
                      ? selectedVariantId() === color.variantId
                      : selectedColor() === color.value
                  "
                  [class.out-of-stock]="color.outOfStock"
                >
                  <div
                    class="color-circle small"
                    [style.background-color]="color.hex"
                  ></div>
                </div>

                <span class="color-name">{{ color.label | translate }}</span>
              </button>
            }
          </div>
        </div>
      }
    </div>
  </ng-template>
</div>
