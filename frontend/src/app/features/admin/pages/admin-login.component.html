<div class="container">
  <section class="admin-login-page">
    <div class="admin-login-card">
      <div class="admin-login-copy">
        <h1>Back-office</h1>
        <p>Accesso riservato all'amministrazione operativa.</p>
      </div>

      <form class="admin-login-form" (ngSubmit)="submit()">
        <app-input
          id="admin-password"
          name="password"
          label="Password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          [required]="true"
          [disabled]="loading || lockSecondsRemaining > 0"
        ></app-input>

        <app-button
          type="submit"
          [fullWidth]="true"
          [disabled]="loading || !password.trim() || lockSecondsRemaining > 0"
        >
          {{ loading ? "Accesso..." : "Accedi" }}
        </app-button>
      </form>

      @if (errorMessage) {
        <p class="ui-banner ui-banner--error">{{ errorMessage }}</p>
      }
      @if (lockSecondsRemaining > 0) {
        <p class="hint">Riprova tra {{ lockSecondsRemaining }}s.</p>
      }
    </div>
  </section>
</div>
