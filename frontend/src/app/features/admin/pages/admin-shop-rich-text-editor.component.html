<div class="rich-text-field">
  <div class="rich-text-toolbar" role="toolbar">
    <button
      type="button"
      class="rich-text-toolbar__button"
      (mousedown)="preventToolbarMouseDown($event)"
      (click)="format('bold')"
      title="Grassetto"
      aria-label="Grassetto"
    >
      <strong>B</strong>
    </button>
    <button
      type="button"
      class="rich-text-toolbar__button"
      (mousedown)="preventToolbarMouseDown($event)"
      (click)="format('italic')"
      title="Corsivo"
      aria-label="Corsivo"
    >
      <em>I</em>
    </button>
    <button
      type="button"
      class="rich-text-toolbar__button"
      (mousedown)="preventToolbarMouseDown($event)"
      (click)="format('underline')"
      title="Sottolineato"
      aria-label="Sottolineato"
    >
      <u>U</u>
    </button>
    <button
      type="button"
      class="rich-text-toolbar__button"
      (mousedown)="preventToolbarMouseDown($event)"
      (click)="formatList('unordered')"
      title="Lista puntata"
      aria-label="Lista puntata"
    >
      • Lista
    </button>
    <button
      type="button"
      class="rich-text-toolbar__button"
      (mousedown)="preventToolbarMouseDown($event)"
      (click)="formatList('ordered')"
      title="Lista numerata"
      aria-label="Lista numerata"
    >
      1. Lista
    </button>
    <button
      type="button"
      class="rich-text-toolbar__button"
      (mousedown)="preventToolbarMouseDown($event)"
      (click)="clearFormatting()"
      title="Rimuovi formattazione"
      aria-label="Rimuovi formattazione"
    >
      Tx
    </button>
  </div>
  <div
    #editorRef
    class="ui-form-control textarea-control textarea-control--large rich-text-editor"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    [attr.aria-label]="'Descrizione ' + languageLabel"
    [attr.data-placeholder]="placeholder"
    (input)="onEditorInput($event)"
    (blur)="onEditorBlur($event)"
  ></div>
</div>
<span class="ui-form-caption">
  Supporta grassetto, corsivo, liste puntate e numerate.
</span>
