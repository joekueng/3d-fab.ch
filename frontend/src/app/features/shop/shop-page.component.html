<div class="container hero">
  <h1>{{ 'SHOP.TITLE' | translate }}</h1>
  <p class="subtitle">{{ 'SHOP.SUBTITLE' | translate }}</p>
</div>

<div class="container">
  <div class="grid">
    @for (product of products(); track product.id) {
      <app-product-card [product]="product"></app-product-card>
    }
  </div>
</div>
