name: I18n Checks

on:
  push:
    branches: [main, int, dev]

concurrency:
  group: print-calculator-i18n-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  i18n-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"

      - name: Check translation parity
        shell: bash
        run: |
          cd frontend
          npm run check:i18n
