name: External package metadata

on:
  workflow_dispatch:
  pull_request:
    branches: [main, int, dev]
    paths:
      - frontend/package.json
      - frontend/package-lock.json
      - backend/build.gradle
      - scripts/check-external-packages.mjs
      - scripts/check-frontend-audit.mjs
      - scripts/check-frontend-audit.test.mjs
      - docs/dependency-policy.md
      - .gitea/workflows/dependency-checks.yaml

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Verify registry metadata without installing packages
        run: node scripts/check-external-packages.mjs
      - name: Audit frontend lockfile
        run: |
          node --test scripts/check-frontend-audit.test.mjs
          cd frontend
          npm audit --package-lock-only --ignore-scripts --omit=dev
          node ../scripts/check-frontend-audit.mjs
