<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${language}">
<head><meta charset="UTF-8"><title th:text="${title}">Print session</title></head>
<body style="margin:0;background:#f8f7f4;font-family:Arial,sans-serif;color:#202a33">
  <main style="max-width:560px;margin:32px auto;padding:32px;background:white;border-radius:12px">
    <h1 style="font-size:24px" th:text="${title}"></h1>
    <p th:text="${intro}"></p>
    <p style="margin:32px 0"><a th:href="${resumeUrl}" th:text="${action}" style="display:inline-block;padding:14px 24px;background:#ffcf00;color:#202a33;text-decoration:none;border-radius:8px;font-weight:bold"></a></p>
    <p><span th:text="${expiryLabel}"></span>: <strong th:text="${expiresAt}"></strong></p>
    <p style="font-size:13px;color:#646464" th:text="${notice}"></p>
  </main>
</body>
</html>
