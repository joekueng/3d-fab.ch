<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="styles">
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #eeeeee;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .brand-logo {
            display: block;
            width: 220px;
            max-width: 220px;
            height: auto;
            margin: 0 auto 16px;
        }

        .header h1 {
            color: #333333;
            margin: 0;
        }

        .content {
            color: #555555;
            line-height: 1.6;
        }

        .action {
            margin: 30px 0;
            text-align: center;
        }

        .action-button {
            display: inline-block;
            padding: 14px 24px;
            background-color: #ffcf00;
            color: #202a33;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            font-size: 0.9em;
            color: #999999;
            margin-top: 30px;
            border-top: 1px solid #eeeeee;
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header" th:fragment="header(headlineText)">
        <img class="brand-logo" th:src="${logoUrl}" src="https://3d-fab.ch/assets/images/SVG/logo-giallo-spesso.svg" alt="3D-Fab">
        <h1 th:text="${headlineText}">Thank you for your order #00000000</h1>
    </div>
    <div class="footer" th:fragment="footer(footerText)">
        <p>&copy; <span th:text="${currentYear}">2026</span> 3D-Fab</p>
        <p th:text="${footerText}">Automated message.</p>
    </div>
</body>
</html>
